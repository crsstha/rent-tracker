name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Never let two deploys race to the same Pages project.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # Rename here if the Cloudflare Pages project is called something else.
  PAGES_PROJECT: rent-register

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    # Required by cloudflare/wrangler-action to post the preview URL back.
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # The app is local-first; no backend keys are needed to build it.
          VITE_DATA_BACKEND: dexie

      # A PR builds a preview on its own branch; main publishes production.
      # Cloudflare Pages decides which is which from the branch name, so the
      # only difference is the `--branch` flag.
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=${{ env.PAGES_PROJECT }}
            --branch=${{ github.head_ref || github.ref_name }}
