<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5"
    />
    <title>Rent Register</title>
    <meta name="description" content="Track rent, tenants, and bills across your houses." />
    <meta name="theme-color" content="#7A1F2E" />
    <meta name="color-scheme" content="light dark" />

    <!--
      Stamp the saved theme before first paint. Without this the page renders
      in the default palette for a frame and then swaps, which reads as a flash
      on every cold start. Kept inline and dependency-free on purpose — it must
      run before any bundle loads. Mirrors app/lib/theme/index.ts.
    -->
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('rent-register:appearance')
          var parsed = raw ? JSON.parse(raw) : {}
          var value = parsed.state || parsed || {}
          var mode = value.mode || 'auto'
          var dark =
            mode === 'dark' ||
            (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var palette = (dark ? value.darkPalette : value.lightPalette) || 'terracotta'
          document.documentElement.setAttribute('data-theme', palette)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          /* first run, or storage blocked — the CSS defaults cover it */
        }
      })()
    </script>

    <!-- iOS home-screen install -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rent Register" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#7A1F2E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Print target lives outside #root so nothing can clip the invoice. -->
    <div id="print-root"></div>
    <script type="module" src="/app/index.tsx"></script>
  </body>
</html>
